name: DMN road pieces check (UK)

# The road pieces phones download now, checked as the phone
# gets them. Every piece the live index (dmn-uk.json) lists must be in the release it names, the
# size and SHA-256 the index gives, and read completely (scripts/dmn_pack_check.py). Weekly, after
# the DMN road pieces build.

on:
  pull_request:
    paths:
      - 'scripts/dmn_pack_check.py'
      - 'tests/test_dmn_pack_check.py'
      - '.github/workflows/dmn-check.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1" # Mondays, after dmn-pack.yml

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify category 2 routing-pack release safety against current tests
        run: python3 -m unittest discover -s tests -p 'test_dmn_pack_check.py' -v

  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live index and its pieces
        run: |
          set -euo pipefail
          gh release download dmn-uk -R "$GITHUB_REPOSITORY" -p dmn-uk.json -O dmn-uk.json
          rel=$(jq -r '.release // "dmn-uk"' dmn-uk.json)
          echo "Pieces from release $rel" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$rel" -R "$GITHUB_REPOSITORY" -p 'dmn-*.dmnpack' -D pieces
          cp dmn-uk.json pieces/
      - name: Check every piece
        run: |
          set -o pipefail
          python3 scripts/dmn_pack_check.py check pieces | tee -a "$GITHUB_STEP_SUMMARY"
