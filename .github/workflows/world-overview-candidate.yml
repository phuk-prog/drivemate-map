name: Worldwide overview candidate PMTiles (no publication)
# Only builds a test artifact. Does not replace, publish or sign UK map data.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/world-overview-candidate.yml
      - scripts/world_sources.py
      - scripts/world_tiles.py
      - schema/world-overview.yml
      - tests/test_world_tiles.py
permissions:
  contents: read
concurrency:
  group: map-world-overview-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact source and MVT verifiers
        run: python3 -m pip install -q shapely==2.2.0 pmtiles==3.4.1 mapbox-vector-tile==2.2.0 PyYAML==6.0.3
      - name: Download and verify pinned Planetiler generation engine
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 \
            https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar \
            -o work/planetiler.jar
          echo "5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29  work/planetiler.jar" | sha256sum --check --strict
      - name: Get true worldwide 110m source and repair topology only for rendering
        run: |
          set -euo pipefail
          python3 scripts/world_sources.py --repo "$GITHUB_REPOSITORY" --work work/world-source
          python3 scripts/world_tiles.py --source-dir work/world-source --output-dir work/world-tiles
      - name: Validate world schema and build actual low-zoom vector PMTiles
        run: |
          set -euo pipefail
          java -jar work/planetiler.jar verify schema/world-overview.yml 2>&1 | tee work/world-schema-verify.log
          grep -q " passed" work/world-schema-verify.log && ! grep -q "failed" work/world-schema-verify.log
          java -Xmx4g -jar work/planetiler.jar generate-custom \
            --schema=schema/world-overview.yml --maxzoom=5 \
            --download_osm_tile_weights=false \
            --output=out/world-overview.pmtiles --force \
            2>&1 | tee work/world-build.log
      - name: Verify real worldwide land tiles across six continents
        run: |
          set -euo pipefail
          python3 scripts/world_tiles.py --verify out/world-overview.pmtiles | tee work/world-render-check.json
      - name: Keep candidate worldwide map and verification report; do not publish
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-overview-candidate-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            out/world-overview.pmtiles
            work/world-tiles/world-build-inputs.json
            work/world-schema-verify.log
            work/world-render-check.json
