name: DMN road pieces (UK)

# DMN's UK road map in pieces for the DriveMate app: quarter-degree squares
# with every road plus one UK motorway/trunk piece, written by DMN's map reader
# (drivemate-tests tools/dmn_pack.py) from the Geofabrik UK extract (including
# Northern Ireland), updated and clipped back to its UK source polygon. Rebuilt after a regional update whenever any region changed;
# the hourly map-watchdog.yml starts it again if missed. The app downloads and keeps the pieces a
# journey needs (dmn/DmnTiles.kt).
#
# Safe update and rollback: each build's pieces go in their own dated
# release (dmn-uk-YYYYMMDD-N), never overwriting the pieces phones use now. A build is published only
# when every piece passes scripts/dmn_pack_check.py and it is no smaller than the live map; then every
# piece is checked as uploaded whole, the live index is kept as dmn-uk-previous.json, and the new
# index (dmn-uk.json on the rolling release "dmn-uk") is switched last. Starting this job with
# "rollback" puts the previous index back (a second rollback undoes the first). The 3 newest dated
# releases, and any an index still names, are kept.

on:
  # One explicit category 2 road-pack rebuild request on main triggers a complete source-backed rebuild.
  # The request is committed only after the current DMN writer is merged/verified.
  push:
    branches: [main]
    paths: ['ci/m02-dmn-rebuild-request.txt']
  workflow_dispatch:
    inputs:
      dmn_ref:
        description: "drivemate-tests branch or commit with tools/dmn_pack.py"
        required: false
        default: main
      force:
        description: Build even when no region changed
        type: boolean
        default: false
      rollback:
        description: "Put the previous index back instead of building"
        type: boolean
        required: false
        default: false
  # Twice a day with the regional maps: rebuilt when any region changed since the last pieces.
  workflow_run:
    workflows: [Progressive regional maps]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: dmn-pack
  cancel-in-progress: false
env:
  # Only the explicit M02 push request uses this exact graph-tested writer revision.
  # Scheduled regional-map updates and manual dispatch keep their usual refs.
  DMN_REF: ${{ inputs.dmn_ref || (github.event_name == 'push' && 'be85be852f3a6840cc049051933065de1c7216f7' || 'main') }}
  GH_TOKEN: ${{ github.token }}
jobs:
  source:
    if: ${{ !inputs.rollback && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      due: ${{ steps.due.outputs.due }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: due
        env:
          FORCE: ${{ github.event_name == 'push' && '--force' || inputs.force && '--force' || '' }}
        run: python3 scripts/dmn_due.py --repo "$GITHUB_REPOSITORY" --work work/dmn-due $FORCE
      - name: UK source and polygon, up to the latest slot
        id: source
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir -p work/extracts
          path=europe/united-kingdom
          name=united-kingdom-latest.osm.pbf
          curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
            --retry-delay 15 --connect-timeout 30 --max-time 2400 \
            -o "work/extracts/$name" "https://download.geofabrik.de/$path-latest.osm.pbf"
          want=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 60 \
            "https://download.geofabrik.de/$path-latest.osm.pbf.md5" | cut -d' ' -f1)
          echo "$want  work/extracts/$name" | md5sum --check --strict
          curl --fail --silent --show-error --location --proto '=https' --retry 5 \
            --retry-all-errors --max-time 120 -o work/uk-source.poly \
            "https://download.geofabrik.de/europe/united-kingdom.poly"
          test -s work/uk-source.poly
          python3 scripts/uk_map.py --repo "$GITHUB_REPOSITORY" --work work/dmn-src changes \
            --source "work/extracts/$name" --out uk.osm.pbf --polygon work/uk-source.poly
          rm -f "work/extracts/$name"
          slot=$(python3 -c "import json;print(json.load(open('work/dmn-src/state.json'))['changes'])")
          echo "tag=OpenStreetMap UK to $slot" >> "$GITHUB_OUTPUT"
          echo "OSM source: Geofabrik UK including Northern Ireland, changes to $slot" >> "$GITHUB_STEP_SUMMARY"
          echo "Source polygon SHA-256: $(sha256sum work/uk-source.poly | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.due.outputs.due == 'true'
        with:
          name: dmn-source
          path: |
            uk.osm.pbf
            work/dmn-due/regions.json
          retention-days: 1

  pieces:
    needs: source
    if: needs.source.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        rows: ["199:203", "204:204", "205:205", "206:206", "207:207", "208:208", "209:211", "212:213", "214:215", "216:218", "219:223", "224:228", "229:233", "234:243", "main"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: phuk-prog/drivemate-tests
          ref: ${{ env.DMN_REF }}
          path: dmn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          pip install -q osmium==4.3.1
          (cd dmn && python3 -m unittest tools.test_dmn_pack)
      - uses: actions/download-artifact@v4
        with:
          name: dmn-source
      - name: Build pieces
        run: |
          src="${{ needs.source.outputs.tag }}"
          if [ "${{ matrix.rows }}" = main ]; then
            python3 scripts/dmn_tiles.py main uk.osm.pbf --dmn dmn --out out --source "$src"
          else
            python3 scripts/dmn_tiles.py band uk.osm.pbf --rows "${{ matrix.rows }}" --dmn dmn --out out --jobs 3 --source "$src"
          fi
          rm uk.osm.pbf
          du -sh out; ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: dmn-${{ matrix.rows == 'main' && 'main' || strategy.job-index }}
          path: out/
          retention-days: 3

  publish:
    needs: [source, pieces]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: dmn-[0-9m]*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dmn-source
          path: source
      - name: Index (names this build's dated release)
        id: index
        run: |
          rel="dmn-uk-$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"
          python3 scripts/dmn_tiles.py index parts --source "${{ needs.source.outputs.tag }}" \
            --built "$(date -u +%F)" --release "$rel" --regions source/work/dmn-due/regions.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Safety check (every piece passes, no smaller than the live map)
        run: |
          gh release download dmn-uk -R "$GITHUB_REPOSITORY" -p dmn-uk.json -O live.json || rm -f live.json
          set -o pipefail
          python3 scripts/dmn_pack_check.py gate parts --live live.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload pieces to the dated release
        env:
          REL: ${{ steps.index.outputs.rel }}
        run: |
          # Resumes after GitHub's API rate limit instead of failing part-way (C02.3).
          python3 scripts/dmn_upload.py --repo "$GITHUB_REPOSITORY" --release "$REL" parts/*.dmnpack
      - name: Check every piece uploaded whole
        env:
          REL: ${{ steps.index.outputs.rel }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REL" --jq .id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[]|{name,size}' | jq -s . > assets.json
          python3 scripts/dmn_pack_check.py uploaded parts/dmn-uk.json assets.json
      - name: Switch phones to it (previous index kept, new index last)
        run: |
          set -euo pipefail
          gh release view dmn-uk -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dmn-uk -R "$GITHUB_REPOSITORY" --title "DMN road pieces (UK)" \
              --notes "Index of DMN road map pieces for the DriveMate app (© OpenStreetMap contributors, ODbL 1.0). The pieces are in the dated release the index names. Rebuilt weekly." --latest=false
          if [ -f live.json ]; then
            cp live.json dmn-uk-previous.json
            gh release upload dmn-uk -R "$GITHUB_REPOSITORY" --clobber dmn-uk-previous.json
          fi
          gh release upload dmn-uk -R "$GITHUB_REPOSITORY" --clobber parts/dmn-uk.json
          echo "Phones now use ${{ steps.index.outputs.rel }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove old dated releases (keep the 3 newest and any an index names)
        run: |
          set -euo pipefail
          keep="${{ steps.index.outputs.rel }}"
          [ -f dmn-uk-previous.json ] && keep="$keep $(jq -r '.release // empty' dmn-uk-previous.json)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' \
            | grep -E '^dmn-uk-[0-9]{8}-[0-9]+$' | sort -t- -k3,3nr -k4,4nr > dated.txt || true
          tail -n +4 dated.txt | while read -r rel; do
            case " $keep " in *" $rel "*) continue ;; esac
            gh release delete "$rel" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
            echo "removed $rel"
          done

  rollback:
    if: ${{ inputs.rollback }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Put the previous index back (checked first)
        run: |
          set -euo pipefail
          gh release download dmn-uk -R "$GITHUB_REPOSITORY" -p dmn-uk.json -O current.json
          gh release download dmn-uk -R "$GITHUB_REPOSITORY" -p dmn-uk-previous.json -O previous.json
          rel=$(jq -r '.release // empty' previous.json)
          if [ -z "$rel" ]; then echo "The previous index names no dated release: not rolled back" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$rel" --jq .id) || {
            echo "Release $rel is gone: not rolled back" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[]|{name,size}' | jq -s . > assets.json
          python3 scripts/dmn_pack_check.py uploaded previous.json assets.json
          mkdir -p swap && cp previous.json swap/dmn-uk.json && cp current.json swap/dmn-uk-previous.json
          gh release upload dmn-uk -R "$GITHUB_REPOSITORY" --clobber swap/dmn-uk-previous.json
          gh release upload dmn-uk -R "$GITHUB_REPOSITORY" --clobber swap/dmn-uk.json
          echo "Rolled back: phones now use $rel (was $(jq -r '.release // "dmn-uk"' current.json))" >> "$GITHUB_STEP_SUMMARY"
