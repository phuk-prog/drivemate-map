name: Worldwide overview PMTiles — verified change-only publication
# Follow the successful 01:00/14:00 UK source check. No duplicate schedule,
# no PR-token publication, and no replacement of the existing UK map.
on:
  workflow_run:
    workflows: ["Worldwide overview source checks (Natural Earth)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified changes (false performs validation only)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: world-overview-immutable-publication
  cancel-in-progress: false
jobs:
  world-overview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact map source and tile verification libraries
        run: python3 -m pip install -q shapely==2.2.0 pmtiles==3.4.1 mapbox-vector-tile==2.2.0 PyYAML==6.0.3
      - name: Check pinned source identity and generator fingerprint before any render
        id: plan
        run: |
          set -euo pipefail
          mkdir -p work/world-publish
          python3 scripts/world_map_publish.py --repo "$GITHUB_REPOSITORY" --work work/world-publish due |
            tee work/world-publish/due.txt
      - uses: actions/setup-java@v4
        if: steps.plan.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned exact world sources and verified map generator
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          mkdir -p work out
          python3 scripts/world_map_publish.py --repo "$GITHUB_REPOSITORY" --work work/world-publish fetch
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 300 \
            https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar \
            --output work/planetiler.jar
          echo "5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29  work/planetiler.jar" |
            sha256sum --check --strict
      - name: Repair topology in temporary rendering inputs; never modify source release bytes
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          python3 scripts/world_tiles.py --source-dir work/world-publish/sources --output-dir work/world-tiles
      - name: Build and verify actual low-zoom worldwide PMTiles
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          java -jar work/planetiler.jar verify schema/world-overview.yml 2>&1 | tee work/world-schema-verify.log
          grep -q ' passed' work/world-schema-verify.log && ! grep -q 'failed' work/world-schema-verify.log
          java -Xmx4g -jar work/planetiler.jar generate-custom \
            --schema=schema/world-overview.yml --maxzoom=5 \
            --download_osm_tile_weights=false \
            --output=out/world-overview.pmtiles --force 2>&1 | tee work/world-build.log
          python3 scripts/world_tiles.py --verify out/world-overview.pmtiles | tee work/world-render-check.json
      - name: Promote only after verified six-continent tiles and immutable asset read-back
        if: >-
          steps.plan.outputs.due == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
        run: |
          set -euo pipefail
          python3 scripts/world_map_publish.py --repo "$GITHUB_REPOSITORY" \
            --work work/world-publish publish --map out/world-overview.pmtiles \
            | tee work/world-publish/published.txt
      - name: Retain proof and bounded test artifact for diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-overview-publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            work/world-publish/due.txt
            work/world-publish/published.txt
            work/world-tiles/world-build-inputs.json
            work/world-render-check.json
