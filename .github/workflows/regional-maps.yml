name: Progressive regional maps
# Twice a day (01:00 and 14:00 UK) every changed region is rebuilt, up to six at a time:
#   plan    - chooses every region behind this update, makes the shared OSM change file once
#   build   - one job per region: download, apply changes, clip, build, upload and verify its files
#   promote - the only catalogue writer: adds every region that built, in one change
# A failed region does not stop the others; it stays behind the slot and the hourly
# map-watchdog.yml starts another update for it.
on:
  workflow_dispatch:
  schedule:
    # 01:00 and 14:00 UK. Each pair is BST/GMT; daily_schedule.py runs exactly one of each.
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/regional-maps.yml
      - scripts/**
      - schema/drivemate-map.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: regional-map-publisher
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      month: ${{ steps.month.outputs.month }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: python3 scripts/daily_schedule.py --event "$EVENT_NAME" --cron "$EVENT_CRON" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.clock.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Install planner
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool jq > /dev/null
          python3 -m pip install -q shapely==2.2.0 pyproj==3.8.0 PyYAML==6.0.3 pmtiles==3.4.1 mapbox-vector-tile==2.2.0 osmium==4.3.1 overturemaps pyarrow
          python3 scripts/unified_preflight.py --repo . --base-sha HEAD
      - id: month
        if: steps.clock.outputs.due == 'true'
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The 900 MB sea outlines, needed by every coastal region: checked here once, saved
      # for the build jobs, and kept on the map-data-sources release as a fallback.
      - id: sea-cache
        if: steps.clock.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/sources/water-polygons-split-3857.zip
          key: osm-water-polygons-v2-${{ steps.month.outputs.month }}
          restore-keys: osm-water-polygons-v2-
      - name: Make sure the sea outlines are present and whole
        id: sea
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          mkdir -p work/sources
          zip=work/sources/water-polygons-split-3857.zip
          whole() { [ -s "$zip" ] && [ "$(stat -c %s "$zip")" -gt 100000000 ] && unzip -tqq "$zip" > /dev/null; }
          if [ "${{ steps.sea-cache.outputs.cache-hit }}" = true ] && whole; then echo "fresh=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          rm -f "$zip"
          if curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
               --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$zip" \
               https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip && whole; then
            echo "Fresh sea outlines from osmdata.openstreetmap.de"
            gh release view map-data-sources --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create map-data-sources --repo "$GITHUB_REPOSITORY" --prerelease --title map-data-sources \
                --notes 'Kept copies of slow map sources. OpenStreetMap contributors (ODbL).'
            gh release upload map-data-sources "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            rm -f "$zip"
            echo "::warning::osmdata.openstreetmap.de unavailable; using the kept copy"
            gh release download map-data-sources --repo "$GITHUB_REPOSITORY" --pattern water-polygons-split-3857.zip --dir work/sources
            whole
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
      - if: steps.clock.outputs.due == 'true' && steps.sea.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: work/sources/water-polygons-split-3857.zip
          key: osm-water-polygons-v2-${{ steps.month.outputs.month }}
      - name: Choose every region behind this update
        id: plan
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          mkdir -p work
          python3 scripts/progressive_regions.py --repo "$GITHUB_REPOSITORY" plan --out work/plan.json | tee work/plan.log
          grep '^matrix=' work/plan.log | tail -1 >> "$GITHUB_OUTPUT"
      - if: steps.clock.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regional-plan-${{ github.run_id }}
          path: work/plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and verify regional builder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool jq > /dev/null
          python3 -m pip install -q shapely==2.2.0 pyproj==3.8.0 PyYAML==6.0.3 pmtiles==3.4.1 mapbox-vector-tile==2.2.0 pyvalhalla==3.6.3 osmium==4.3.1 overturemaps pyarrow
          mkdir -p work/sources
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar -o work/planetiler.jar
          echo '5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29  work/planetiler.jar' | sha256sum --check --strict
          curl -fsSL --retry 5 --retry-all-errors --max-time 60 https://raw.githubusercontent.com/valhalla/valhalla/3.6.3/scripts/valhalla_build_extract -o work/valhalla_build_extract
          echo '37daac2ff760552c79431b41653be6d457e7e30d051e400c29064208fce65ae4  work/valhalla_build_extract' | sha256sum --check --strict
      - id: sea-cache
        uses: actions/cache/restore@v4
        with:
          path: work/sources/water-polygons-split-3857.zip
          key: osm-water-polygons-v2-${{ needs.plan.outputs.month }}
          restore-keys: osm-water-polygons-v2-
      - name: Sea outlines (saved copy, else the kept copy)
        run: |
          set -euo pipefail
          zip=work/sources/water-polygons-split-3857.zip
          whole() { [ -s "$zip" ] && [ "$(stat -c %s "$zip")" -gt 100000000 ] && unzip -tqq "$zip" > /dev/null; }
          whole && exit 0
          rm -f "$zip"
          gh release download map-data-sources --repo "$GITHUB_REPOSITORY" --pattern water-polygons-split-3857.zip --dir work/sources
          whole
      - uses: actions/download-artifact@v4
        with:
          name: regional-plan-${{ github.run_id }}
          path: work
      - name: Build, upload and verify ${{ matrix.region }}
        run: |
          set -euo pipefail
          mkdir -p work/entries
          python3 scripts/progressive_regions.py --repo "$GITHUB_REPOSITORY" build \
            --plan work/plan.json --region "${{ matrix.region }}" --out "work/entries/${{ matrix.region }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regional-entry-${{ matrix.region }}
          path: work/entries/${{ matrix.region }}.json
          retention-days: 7
      - name: Retain regional validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regional-validation-${{ matrix.region }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            work/regional/*/out/region-quality.json
            work/regional/*/out/source-inventory.json
            work/regional/*/out/source-import-status.json
            work/regional/*/out/map-validation.json
            work/regional/*/out/routing-validation.json

  promote:
    needs: [plan, build]
    if: always() && needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: regional-plan-${{ github.run_id }}
          path: work
      - uses: actions/download-artifact@v4
        with:
          pattern: regional-entry-*
          path: work/entries
          merge-multiple: true
      - name: Add every region that built to the catalogue at once
        run: |
          set -euo pipefail
          mkdir -p work/entries
          python3 -m pip install -q PyYAML==6.0.3
          python3 scripts/progressive_regions.py --repo "$GITHUB_REPOSITORY" promote \
            --plan work/plan.json --entries work/entries | tee -a "$GITHUB_STEP_SUMMARY"
