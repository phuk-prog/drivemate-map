name: Progressive regional maps
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/regional-maps.yml
      - scripts/**
      - schema/drivemate-map.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: regional-map-publisher
  cancel-in-progress: false
jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: python3 scripts/daily_schedule.py --event "$EVENT_NAME" --cron "$EVENT_CRON" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.clock.outputs.due == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: steps.clock.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and verify regional builder
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool jq > /dev/null
          python3 -m pip install shapely==2.2.0 pyproj==3.8.0 PyYAML==6.0.3 pmtiles==3.4.1 mapbox-vector-tile==2.2.0 pyvalhalla==3.6.3 osmium==4.3.1 overturemaps pyarrow
          python3 scripts/unified_preflight.py --repo . --base-sha HEAD
          mkdir -p work/sources
          curl -fsSL --retry 2 --max-time 300 https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar -o work/planetiler.jar
          echo '5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29  work/planetiler.jar' | sha256sum --check --strict
          curl -fsSL --retry 2 --max-time 60 https://raw.githubusercontent.com/valhalla/valhalla/3.6.3/scripts/valhalla_build_extract -o work/valhalla_build_extract
          echo '37daac2ff760552c79431b41653be6d457e7e30d051e400c29064208fce65ae4  work/valhalla_build_extract' | sha256sum --check --strict
      - uses: actions/cache@v4
        if: steps.clock.outputs.due == 'true'
        with:
          path: work/sources
          key: osm-coast-polygons-2026-10-v1
      - name: Check regional changes, build next region and publish verified bundle
        if: steps.clock.outputs.due == 'true'
        run: python3 scripts/progressive_regions.py --repo "$GITHUB_REPOSITORY"
      - name: Retain regional validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regional-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            work/regional/*/out/region-quality.json
            work/regional/*/out/source-inventory.json
            work/regional/*/out/source-import-status.json
            work/regional/*/out/map-validation.json
            work/regional/*/out/routing-validation.json
            build/reports/unified-preflight.json
