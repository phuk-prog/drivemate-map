name: Update map regions

on:
  schedule:
    # Every 5 minutes, the shortest interval GitHub allows. A run that finds nothing new exits in under a minute,
    # and the public repo has no Actions minute limit. Scheduled starts are delayed under load, so they are not exact.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-maps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OSM caches (restrictions, lanes, speed, warnings) are small, and rebuilding them needs the whole extract.
      # Restore the latest copy; tools/osm-prepare.mjs skips the download when the extract has not changed.
      - name: Restore OSM caches
        uses: actions/cache@v4
        with:
          path: data/osm-cache
          key: osm-cache-${{ github.run_id }}
          restore-keys: osm-cache-

      - name: Build new and changed regions
        env:
          MAX_REGIONS_PER_RUN: "2"
          MAX_SQUARES_PER_RUN: "100"
          TRUST_INDEX: "1"
        run: node --max-old-space-size=8000 tools/update-regions.mjs

      - name: Test every published map file
        run: node --max-old-space-size=8000 tools/test-map.mjs

      # The index is staged here but not committed or pushed until the release upload has succeeded.
      - name: Check whether the index changed
        id: changes
        run: |
          git add data/published/index.json data/published/squares/index.json regions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed map data. Nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compress square files for faster phone downloads
        run: |
          shopt -s nullglob   # no square built in this run: the loop does nothing, instead of failing on the literal pattern
          for f in data/published/squares/*.dmap; do gzip -9 -c "$f" > "$f.gz"; done

      - name: Publish map files to their releases
        if: steps.changes.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Region files go to maps-latest; square files go to the squares-NNN release in their index entry.
        # Nothing is uploaded if no file is found, or if a release would exceed GitHub's asset limit.
        run: node tools/publish-releases.mjs

      # Runs only after the upload above has succeeded. A failed build, test, compress or upload stops the
      # job before this step, so the index on the branch never names files the release does not have.
      - name: Commit index and push
        if: steps.changes.outputs.changed == 'true' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update map index ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:${GITHUB_REF_NAME}
