name: Published UK guidance source integrity
on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 * * 1"
  workflow_run:
    workflows: [Build our own map data]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  guidance-sources:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No unsupported Mapillary values in lane and speed-limit files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release download map-data-uk -R "$GITHUB_REPOSITORY" -p latest.json -O - | jq -r .extra_tag)
          mkdir -p files && gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'limits-*.json' -p 'lanes-*.json' -D files
          n=$(ls files | wc -l)
          bad=$(grep -lis mapillary files/* || true)
          signs=$(for f in files/limits-*.json; do jq -r 'select((.src // []) | index("m")) | input_filename' "$f"; done)
          if [ -n "$bad$signs" ]; then
            echo "- FAIL unsupported source values found in: $(echo $bad $signs | tr ' ' '\n' | sort -u | head -20 | xargs -n1 basename | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "- PASS no unsupported Mapillary value in $n lane and speed-limit files ($tag)" | tee -a "$GITHUB_STEP_SUMMARY"
