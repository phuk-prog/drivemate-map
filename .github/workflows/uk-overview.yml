name: UK overview map
# One low-detail map of the whole UK, Isle of Man and Channel Islands (zoom 0-10) for
# zoomed-out views. Twice a day with the regional updates, at 01:00 and 14:00 UK.
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and check without publishing
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/uk-overview.yml
      - scripts/uk_overview.py
      - schema/drivemate-map.yml
permissions:
  contents: write
concurrency:
  group: uk-overview-map
  cancel-in-progress: false
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: python3 scripts/daily_schedule.py --event "$EVENT_NAME" --cron "$EVENT_CRON" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.clock.outputs.due == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: steps.clock.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install overview builder
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool > /dev/null
          python3 -m pip install -q pmtiles==3.4.1 mapbox-vector-tile==2.2.0 PyYAML==6.0.3
          mkdir -p work/sources work/extracts
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar -o work/planetiler.jar
          echo '5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29  work/planetiler.jar' | sha256sum --check --strict
      - id: month
        if: steps.clock.outputs.due == 'true'
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: sea-cache
        if: steps.clock.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/sources/water-polygons-split-3857.zip
          key: osm-water-polygons-v2-${{ steps.month.outputs.month }}
          restore-keys: osm-water-polygons-v2-
      - name: Sea outlines (saved copy, else the kept copy, else osmdata)
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          zip=work/sources/water-polygons-split-3857.zip
          whole() { [ -s "$zip" ] && [ "$(stat -c %s "$zip")" -gt 100000000 ] && unzip -tqq "$zip" > /dev/null; }
          whole && exit 0
          rm -f "$zip"
          gh release download map-data-sources --repo "$GITHUB_REPOSITORY" --pattern water-polygons-split-3857.zip --dir work/sources || true
          whole && exit 0
          rm -f "$zip"
          curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
            --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$zip" \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          whole
      - name: Download the UK, Isle of Man and Channel Islands extracts
        if: steps.clock.outputs.due == 'true'
        run: |
          set -euo pipefail
          for path in europe/united-kingdom europe/isle-of-man europe/guernsey-jersey; do
            name=$(basename "$path")-latest.osm.pbf
            curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
              --retry-delay 15 --connect-timeout 30 --max-time 2400 \
              -o "work/extracts/$name" "https://download.geofabrik.de/$path-latest.osm.pbf"
            want=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 60 \
              "https://download.geofabrik.de/$path-latest.osm.pbf.md5" | cut -d' ' -f1)
            echo "$want  work/extracts/$name" | md5sum --check --strict
          done
          ls -la work/extracts
      - name: Build, check and publish the overview map
        if: steps.clock.outputs.due == 'true'
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          flag=""; [ "${VALIDATE_ONLY:-false}" = true ] && flag=--validate-only
          python3 scripts/uk_overview.py --repo "$GITHUB_REPOSITORY" --sources work/extracts $flag
      - name: Keep the overview check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uk-overview-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: work/overview/out/overview-validation.json
