name: Data source and publication regressions

on:
  push:
    branches: [main]
  # Full inexpensive preflight for every PR, including new source/fixture locations.
  # No map downloads, map generation or publishing occurs in this workflow.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drivemate-data-source-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify changed-file scope before installing dependencies
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest tests.test_ci_scope
          python3 scripts/ci_scope.py
      - name: Docs-only check completed without heavy validation
        if: steps.scope.outputs.run_full == 'false'
        run: echo "Documentation-only: no map source validation or publication was run." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.scope.outputs.run_full == 'true'
        with:
          python-version: '3.12'
      - name: Install generator test dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m pip install shapely==2.2.0 pyproj==3.8.0 PyYAML==6.0.3 pmtiles==3.4.1 mapbox-vector-tile==2.2.0
      - name: Run canonical data preflight
        if: steps.scope.outputs.run_full == 'true'
        run: python3 scripts/unified_preflight.py --repo . --base-sha HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (success() || failure()) && steps.scope.outputs.run_full == 'true'
        with:
          name: data-preflight
          path: build/reports/unified-preflight.json
          if-no-files-found: error
