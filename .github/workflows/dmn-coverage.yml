name: DMN published UK road geometry and seams

# Focused real-road check using published DMN packs, no full UK source download.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dmn-coverage.yml
      - scripts/dmn_coverage_check.py

permissions:
  contents: read

concurrency:
  group: dmn-coverage
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Read current index and published real road pieces
        run: |
          set -euo pipefail
          mkdir -p pieces
          gh release download dmn-uk -R "$GITHUB_REPOSITORY" -p dmn-uk.json -D pieces
          rel=$(jq -r '.release // empty' pieces/dmn-uk.json)
          test -n "$rel"
          echo "Road release: $rel" >> "$GITHUB_STEP_SUMMARY"
          for k in $(python3 scripts/dmn_coverage_check.py keys); do
            file="dmn-$k.dmnpack"
            jq -e --arg k "$k" '.tiles[$k].file' pieces/dmn-uk.json >/dev/null
            gh release download "$rel" -R "$GITHUB_REPOSITORY" -p "$file" -D pieces
          done
      - name: Check road nodes at 43 named UK and NI locations
        run: |
          set -o pipefail
          python3 scripts/dmn_coverage_check.py check pieces | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check shared road nodes at selected border and regional seams
        run: |
          set -o pipefail
          python3 scripts/dmn_coverage_check.py seams pieces | tee -a "$GITHUB_STEP_SUMMARY"
