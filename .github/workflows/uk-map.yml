name: UK map
# One detailed UK map (drivemate-v1 layout) the app draws instead of a region and its
# neighbours. Made after a regional update: the Geofabrik UK extract (including
# Northern Ireland) is updated to the latest 01:00 / 14:00 slot, then clipped to
# its source polygon after the worldwide hourly changes, before map generation.
# The hourly map-watchdog.yml starts it again if it was missed or failed. Too large or
# failed: nothing is published and the app keeps the regional maps.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even when no region changed
        type: boolean
        default: false
  workflow_run:
    workflows: [Progressive regional maps]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: uk-map
  cancel-in-progress: false
env:
  PLANETILER_VERSION: '0.10.1'
  PLANETILER_SHA256: 5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: due
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/uk_map.py --repo "$GITHUB_REPOSITORY" due $FORCE
      - name: Make room
        if: steps.due.outputs.due == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-java@v4
        if: steps.due.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools and runner capacity
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool > /dev/null
          python3 -m pip install -q pmtiles==3.4.1 mapbox-vector-tile==2.2.0 PyYAML==6.0.3 shapely==2.2.0 pyproj==3.8.0
          mkdir -p work/sources work/extracts out
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o work/planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          printf '%s  %s\n' "$PLANETILER_SHA256" work/planetiler.jar | sha256sum --check --strict
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = int(next(l.split()[1] for l in Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemTotal:'))) * 1024
          disk = shutil.disk_usage('.').free
          print(f'Runner capacity: {memory / 1024**3:.1f} GiB RAM, {disk / 1024**3:.1f} GiB free disk')
          if memory < 14 * 1024**3 or disk < 35 * 1024**3:
              raise SystemExit('Runner too small for the UK map; nothing built (the app keeps the regional maps)')
          PY
      - name: Sea outlines (kept copy, else osmdata)
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          zip=work/sources/water-polygons-split-3857.zip
          whole() { [ -s "$zip" ] && [ "$(stat -c %s "$zip")" -gt 100000000 ] && unzip -tqq "$zip" > /dev/null; }
          gh release download map-data-sources --repo "$GITHUB_REPOSITORY" --pattern water-polygons-split-3857.zip --dir work/sources || true
          whole && exit 0
          rm -f "$zip"
          curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
            --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$zip" \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          whole
      - name: UK source and polygon, up to the latest slot
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          path=europe/united-kingdom
          name=united-kingdom-latest.osm.pbf
          curl --fail --silent --show-error --location --proto '=https' --retry 8 --retry-all-errors \
            --retry-delay 15 --connect-timeout 30 --max-time 2400 \
            -o "work/extracts/$name" "https://download.geofabrik.de/$path-latest.osm.pbf"
          want=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 60 \
            "https://download.geofabrik.de/$path-latest.osm.pbf.md5" | cut -d' ' -f1)
          echo "$want  work/extracts/$name" | md5sum --check --strict
          curl --fail --silent --show-error --location --proto '=https' --retry 5 \
            --retry-all-errors --max-time 120 -o work/uk-source.poly \
            "https://download.geofabrik.de/europe/united-kingdom.poly"
          test -s work/uk-source.poly
          python3 scripts/uk_map.py --repo "$GITHUB_REPOSITORY" changes \
            --source "work/extracts/$name" --out work/uk.osm.pbf --polygon work/uk-source.poly
          rm -f "work/extracts/$name"
          ls -lh work/uk.osm.pbf
          echo "Source polygon SHA-256: $(sha256sum work/uk-source.poly | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the UK map with the regional schema
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          java -jar work/planetiler.jar verify schema/drivemate-map.yml 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -n 1 | tee work/schema-verify.txt
          grep -q ' passed' work/schema-verify.txt && ! grep -q 'failed' work/schema-verify.txt || { echo "::error::Map layout checks failed"; exit 1; }
          java -Xmx12g -jar work/planetiler.jar generate-custom --schema=schema/drivemate-map.yml \
            --osm_path=work/uk.osm.pbf --ocean_path=work/sources/water-polygons-split-3857.zip \
            --output=out/drivemate-v1.pmtiles --force 2>&1 | tail -n 25
          rm -f work/uk.osm.pbf
          ls -lh out/drivemate-v1.pmtiles
          python3 scripts/verify_pmtiles.py out/drivemate-v1.pmtiles work/uk-map-validation.json --uk-samples --layout own
      - name: Publish the UK map
        if: steps.due.outputs.due == 'true'
        run: python3 scripts/uk_map.py --repo "$GITHUB_REPOSITORY" publish --map out/drivemate-v1.pmtiles
      - name: Keep the check report
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uk-map-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: work/uk-map-validation.json
